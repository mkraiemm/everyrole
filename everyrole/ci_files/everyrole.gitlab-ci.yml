# EveryRole: __APP_NAME__'s tests, run in this pipeline as every kind of user. Your test logins never leave GitLab:
# EveryRole sends the tests, this job types the logins itself, and only the results go back.
# Docs: __API_URL__/docs#ci
#
# Settings -> CI/CD -> Variables (masked and hidden; protected if only protected branches should test):
#   EVERYROLE_API_KEY                   a workspace API key (EveryRole -> Settings -> API keys)
__LOGIN_VARIABLES__#
# Optional: EVERYROLE_GITLAB_TOKEN (a project access token, `api` scope) to comment on the merge request;
#           BASE_URL and EVERYROLE_ENVIRONMENT to test a review app or staging instead of __PRODUCTION_URL__.
# The job runs last in the pipeline (stage .post), after your deploy. It fails when a test is broken; the results
# show in the merge request's test report, and in EveryRole with replays.

everyrole:
  stage: .post
  image: python:3.12-slim-bookworm
  timeout: 45 minutes
  variables:
    EVERYROLE_APP: "__APP__"
    EVERYROLE_URL: "__API_URL__"
    EVERYROLE_RUNNER: "everyrole @ git+https://github.com/mkraiemm/everyrole.git@__RUNNER_REF__"
    CHROME_PATH: /usr/bin/chromium
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends chromium fonts-liberation fonts-noto-color-emoji ffmpeg git ca-certificates > /dev/null
    - pip install --quiet "$EVERYROLE_RUNNER"
  script:
    - everyrole ci --app "$EVERYROLE_APP" --output everyrole-report --comment
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - everyrole-report/
    reports:
      junit: everyrole-report/junit.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
