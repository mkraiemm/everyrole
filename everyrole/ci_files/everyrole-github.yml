# EveryRole: after each successful deploy of __APP_NAME__, its tests run in this workflow as every kind of user.
# Your test logins never leave GitHub: EveryRole sends the tests, this job types the logins itself, and only the
# results go back. The result shows on the pull request, and this check fails when a test broke.
# Docs: __API_URL__/docs#ci
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   EVERYROLE_API_KEY                   a workspace API key (EveryRole -> Settings -> API keys)
__LOGIN_VARIABLES__name: EveryRole

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "The address to test (empty: __PRODUCTION_URL__)"
        required: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: everyrole-${{ github.event.deployment.environment || github.ref }}
  cancel-in-progress: false

jobs:
  everyrole:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: mkraiemm/everyrole@__RUNNER_REF__
        with:
          app: __APP__
          everyrole-url: __API_URL__
          api-key: ${{ secrets.EVERYROLE_API_KEY }}
          base-url: ${{ inputs.base_url || github.event.deployment_status.environment_url || '' }}
__LOGIN_ENV__