name: Bug report
description: Something in EveryRole does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please remove passwords, keys, cookies and private URLs from anything you paste.
        Security problems go through private reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: flow
    attributes:
      label: Flow or config (redacted)
      description: The smallest flow file and config that show the problem.
      render: json
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The terminal output, or the relevant rows of summary.md / results.json.
      render: text
  - type: textarea
    id: doctor
    attributes:
      label: everyrole doctor
      description: Output of `everyrole doctor`.
      render: text
  - type: input
    id: version
    attributes:
      label: EveryRole version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it run
      options:
        - Local machine
        - GitHub Action
        - Other CI
    validations:
      required: true
