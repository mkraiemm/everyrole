name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        shell: bash
        run: python -m ruff check everyrole tests examples scripts

      - name: Test
        shell: bash
        run: python -m pytest -q

  package:
    name: build and smoke-test the wheel
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel in a clean virtualenv and run it
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          /tmp/wheel-env/bin/everyrole --help
          DEMO_EMAIL=demo@example.com DEMO_PASSWORD=demo-password \
            /tmp/wheel-env/bin/everyrole validate "$GITHUB_WORKSPACE/examples/quickstart/flows" \
            --config "$GITHUB_WORKSPACE/examples/quickstart/everyrole.config.json"
          /tmp/wheel-env/bin/python -c "import jev_ultrafast, everyrole; print('everyrole', everyrole.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
